services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-tracks
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pg-tracks-db
      POSTGRES_DB: tracks-db
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 30s
      test: ["CMD-SHELL", "pg_isready" ]
    networks:
      - postgres-tracks-db
    volumes:
      - postgres-data:/var/lib/postgresql/docker

  volume-permissions-helper:
    image: alpine
    volumes:
      - rustfs_data_0:/data0
      - logs:/logs
    command: >
      sh -c "
        chown -R 10001:10001 /data0 /logs &&
        echo 'Volume Permissions fixed' &&
        exit 0
      "
    restart: "no"
    
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    container_name: rustfs-tracks-assets
    depends_on:
      - volume-permissions-helper
    security_opt:
      - "no-new-privileges:true"
    environment:
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=false
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs
    volumes:
      - rustfs_data_0:/data/rustfs0
      - logs:/app/logs
    networks:
      - rustfs-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-ec",
          "host=\"$${RUSTFS_HEALTHCHECK_HOST:-127.0.0.1}\"; scheme=\"http\"; set -- -fsS; \
          if [ -n \"$${RUSTFS_TLS_PATH:-}\" ]; then \
            scheme=\"https\"; \
            ca_path=\"$${RUSTFS_HEALTHCHECK_CA:-}\"; \
            if [ -z \"$${ca_path}\" ] && [ -f /opt/tls/ca.crt ]; then ca_path=/opt/tls/ca.crt; fi; \
            case \"$${host}\" in 127.0.0.1|localhost) strict_host=false ;; *) strict_host=true ;; esac; \
            if [ \"$${strict_host}\" = true ] && [ -n \"$${ca_path}\" ]; then \
              set -- \"$${@}\" --cacert \"$${ca_path}\" --resolve \"$${host}:9000:127.0.0.1\" --resolve \"$${host}:9001:127.0.0.1\"; \
            else \
              set -- \"$${@}\" -k; \
            fi; \
          fi; \
          curl \"$${@}\" \"$${scheme}://$${host}:9000/health\" && \
          curl \"$${@}\" \"$${scheme}://$${host}:9001/rustfs/console/health\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bucket-helper:
    image: debian:12.15-slim
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - rustfs-network
    entrypoint:
      - /bin/sh
      - -c
      - |
        apt update && apt install curl unzip -y
        export PATH=$PATH:/root/.local/bin
        cat > /tmp/assets-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PublicReadObjects",
              "Effect": "Allow",
              "Principal": "*",
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::assets/*"]
            }
          ]
        }
        EOF
        echo "Set bucket policy json"

        curl -fsSL https://awscli.amazonaws.com/v2/install.sh | bash
        echo "Installed awscli"

        { echo "rustfsadmin"; echo "rustfsadmin"; echo "eu-west-1"; echo "json"; } | aws configure
        echo "Configured awscli"

        aws s3api create-bucket \
        --bucket assets \
        --endpoint-url http://rustfs:9000

        aws s3api put-bucket-policy \
        --bucket assets \
        --policy file:///tmp/assets-policy.json \
        --endpoint-url http://rustfs:9000
    restart: "no"

  tracks-catalog-svc:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      bucket-helper:
        condition: service_completed_successfully
    networks:
      - postgres-tracks-db
      - rustfs-network
    volumes:
      - .:/app
    ports:
      - "7878:8080"

volumes:
  postgres-data:
    driver: local
  rustfs_data_0:
  logs:

networks:
  rustfs-network:
    driver: bridge
  postgres-tracks-db:
    driver: bridge