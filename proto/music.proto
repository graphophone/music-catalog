syntax = "proto3";

package music;

service Music {
    rpc CheckUploader(CheckUploaderReq) returns (Empty);
    rpc GetFullMusic(FullMusicReq) returns (FullMusic);
    rpc UploadMusic(UploadMusicReq) returns (MusicId);
    rpc UpdateMusic(UpdateMusicReq) returns (Empty);
    rpc UploadThumbnail(UploadAssetReq) returns (UploadAssetRes);
    rpc NotifyUploadThumbnail(NotifyUploadAssetReq) returns (Empty);
    rpc RemoveThumbnail(RemoveThumbnailReq) returns (Empty);
    rpc UploadMusicAudio(UploadAssetReq) returns (UploadAssetRes);
    rpc NotifyUploadMusicAudio(NotifyUploadAssetReq) returns (Empty);
    rpc RemoveMusic(RemoveMusicReq) returns (Empty);
    rpc LinkMusicAudio(LinkMusicAudioReq) returns (Empty);
    rpc RequestMusicPlay(MusicId) returns (MusicPlayResponse);

    rpc GetUserMusic(UserMusicReq) returns (UserMusicPage);
}

message Empty {}

message UserMusicReq {
    int64 user_id = 1;
    int32 page_number = 2;
    optional int64 requester_id = 3;
}

message UserMusic {
    int64 id = 1;
    string title = 2;
    optional string thumbnail_id = 3;
    optional int64 duration_seconds = 4;
    int64 play_count = 5;
    int64 like_count = 6;
    bool is_liked = 7;
    string upload_status = 8;
}

message UserMusicPage {
    repeated UserMusic music_entries = 1;
    int64 total_pages = 2;
}

message CheckUploaderReq {
    int64 music_id = 1;
    int64 uploader_id = 2;
}

message UploadMusicReq {
    string title = 1;
    optional string description = 2;
    int64 uploader_id = 3;
    repeated int64 categories_ids = 4;
}

message UpdateMusicReq {
    int64 music_id = 1;
    string title = 2;
    optional string description = 3;
    repeated int64 categories_ids = 4;
}

message UploadAssetReq {
    int64 music_id = 1;
    string mime_type = 2;
}

message UploadAssetRes {
    string upload_url = 1;
    string asset_id = 2;
}

message NotifyUploadAssetReq {
    int64 music_id = 1;
    string asset_id = 2;
}

message RemoveThumbnailReq {
    int64 music_id = 1;
}

message RemoveMusicReq {
    int64 music_id = 1;
}

message LinkMusicAudioReq {
    int64 music_id = 1;
    string audio_id = 2;
    int64 duration_seconds = 3;
}

message FullMusic {
    int64 id = 1;
    string title = 2;
    optional string description = 3;
    optional string thumbnail_id = 4;
    optional int64 duration_seconds = 5;
    int64 play_count = 6;
    int64 like_count = 7;
    int64 uploader_id = 8;
    repeated Category categories = 9;
    string upload_status = 10;
    int64 created_at = 11;
    bool is_liked = 12;
}

message FullMusicReq {
    int64 music_id = 1;
    optional int64 user_id = 2;
}

message MusicId {
    int64 id = 1;
}

message MusicPlayResponse {
    string hls_master_id = 1;
}

message Category {
    int64 id = 1;
    string name = 2;
}