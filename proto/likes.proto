syntax = "proto3";

package likes;

service Likes {
    rpc like_music(LikeMusicRequest) returns (Empty);
    rpc unlike_music(UnlikeMusicRequest) returns (Empty);
    rpc get_user_liked(GetUserLikedRequest) returns (LikedPage);
}

message Empty {}

message LikeMusicRequest {
    int64 user_id = 1;
    int64 music_id = 2;
}

message UnlikeMusicRequest {
    int64 user_id = 1;
    int64 music_id = 2;
}

message GetUserLikedRequest {
    int64 user_id = 1;
    int32 page_number = 2;
    int32 page_size = 3;
}

message LikedPage {
    repeated LikedMusic liked_music = 1;
    int64 total_count = 2;
}

message LikedMusic {
    int64 id = 1;
    string title = 2;
    optional string thumbnail_id = 3;
    optional int64 duration_seconds = 4;
    int64 play_count = 5;
}