[package]
name = "music-catalog"
version = "0.1.0"
edition = "2024"

[dependencies]
config = "0.15"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "macros"] }
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
anyhow = "1.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }

[build-dependencies]
tonic-prost-build = "0.14"
